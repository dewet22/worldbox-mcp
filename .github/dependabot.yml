version: 2

updates:
  # Python (MCP server)
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-minor:
        update-types: ["minor", "patch"]

  # .NET (BepInEx mod)
  - package-ecosystem: "nuget"
    directory: "/mod"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "dotnet"
    commit-message:
      prefix: "deps"
      include: "scope"
    ignore:
      # Pin BepInEx — bumps must be manual (cross-version testing required)
      - dependency-name: "BepInEx.Core"
      - dependency-name: "BepInEx.PluginInfoProps"
      # Pin UnityEngine.Modules to the engine version WorldBox ships (2022.3.60f1 for 0.51.2).
      # Bumping it must follow a game update, not a package release.
      - dependency-name: "UnityEngine.Modules"
      # Cap FluentAssertions at 6.x — v7+ shipped under a paid commercial license
      # ($130/dev/year via Xceed). v6 was the last MIT/Apache release. Stay there until
      # we either pay or migrate to AwesomeAssertions / Shouldly. Tracked separately.
      - dependency-name: "FluentAssertions"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
