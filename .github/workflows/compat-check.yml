name: WorldBox compatibility check

# Daily check: detect a new WorldBox build on Steam and open a tracking issue,
# so the mod's reflection bindings get re-verified against the new
# Assembly-CSharp.dll.
#
# State is kept in two places, neither of which this workflow writes to.
# `.github/worldbox-build-baseline.txt` holds the build the compatibility matrix
# was last verified against, and a maintainer bumps it by hand after re-testing.
# The issues carry the rest: a build id already named by an issue, open or
# closed, is never reported twice, so closing the issue stops the reminder
# instead of postponing it by a day.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Detect new WorldBox build
    runs-on: ubuntu-latest
    env:
      STEAM_APPID: "1206560"
    steps:
      - uses: actions/checkout@v7

      - name: Read the public branch build id
        id: steam
        run: |
          # api.steamcmd.net mirrors what `steamcmd +app_info_print` returns.
          # Steam's own ISteamApps/UpToDateCheck endpoint does not know this
          # appid and answers `success: false` for it, which is why the daily
          # run compared an error payload against nothing for months.
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://api.steamcmd.net/v1/info/${STEAM_APPID}" -o app.json
          buildid=$(jq -r --arg id "$STEAM_APPID" \
            '.data[$id].depots.branches.public.buildid // empty' app.json)
          if [ -z "$buildid" ]; then
            echo "::error::No public build id for appid ${STEAM_APPID}; the API shape may have changed."
            head -c 500 app.json
            exit 1
          fi
          echo "buildid=$buildid" >> "$GITHUB_OUTPUT"
          echo "Public branch build id: ${buildid}"

      - name: Compare against the verified baseline
        id: baseline
        env:
          BUILDID: ${{ steps.steam.outputs.buildid }}
        run: |
          baseline=$(tr -d '[:space:]' < .github/worldbox-build-baseline.txt)
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          if [ "$baseline" = "$BUILDID" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Build ${BUILDID} still matches the verified baseline, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Build ${BUILDID} differs from the verified baseline ${baseline}."
          fi

      - name: Open a tracking issue
        if: steps.baseline.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILDID: ${{ steps.steam.outputs.buildid }}
          BASELINE: ${{ steps.baseline.outputs.baseline }}
        run: |
          title="compat: WorldBox build ${BUILDID}"
          seen=$(TITLE="$title" gh issue list \
            --label wb-update \
            --state all \
            --limit 200 \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$seen" ]; then
            echo "Build ${BUILDID} is already tracked by issue #${seen}, skipping."
            exit 0
          fi

          gh issue create \
            --title "$title" \
            --label "wb-update,needs-triage" \
            --body "$(cat <<EOF
          Steam is serving a WorldBox build the compatibility matrix has not been checked against.

          - Verified baseline: \`$BASELINE\` (\`.github/worldbox-build-baseline.txt\`)
          - Public branch now: \`$BUILDID\`

          Next steps for a maintainer:

          1. Pull the new \`Assembly-CSharp.dll\` from a local install.
          2. Decompile with ILSpy and diff the key types listed in [\`docs/game-api-notes.md\`]($REPO_URL/blob/main/docs/game-api-notes.md): \`MapBox\`, \`World\`, \`AssetManager\`, \`Actor\`, \`Kingdom\`.
          3. Run the e2e smoke suite (\`server/tests/e2e\`) against the updated game.
          4. Add a row to [\`docs/compatibility.md\`]($REPO_URL/blob/main/docs/compatibility.md).
          5. Write \`$BUILDID\` into \`.github/worldbox-build-baseline.txt\` so this check goes quiet again.
          6. Tag a patch release if anything broke.

          ---
          _Automated by \`.github/workflows/compat-check.yml\`._
          EOF
          )"
